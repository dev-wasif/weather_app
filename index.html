<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="16" fill="%230f172a"/>
    <rect x="8" y="8" width="48" height="48" rx="12"
    fill="rgba(255,255,255,0.05)"
    stroke="rgba(255,255,255,0.12)"
    stroke-width="2"/>
    <path d="M20 32L30 42L44 22"
    fill="none"
    stroke="%2338bdf8"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
    </svg>'>

</head>

<body>

    <div class="main-wrapper">
        <div class="glass-container">
            <div class="search-section">
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
                    <button id="searchBtn">Find</button>
                </div>
            </div>

            <div class="display-section">
                <div class="visual">
                    <img src="https://openweathermap.org/img/wn/01d@4x.png" id="weatherIcon" alt="weather">
                </div>
                <div class="content">
                    <h1 id="temp">28°</h1>
                    <h2 id="cityName">Karachi</h2>
                    <p id="condition">Cloudy Sky</p>
                </div>
            </div>

            <div class="details-grid">
                <div class="detail-card">
                    <i data-lucide="droplets"></i>
                    <span id="humidity">65%</span>
                    <p>Humidity</p>
                </div>
                <div class="detail-card">
                    <i data-lucide="wind"></i>
                    <span id="wind">12 km/h</span>
                    <p>Wind</p>
                </div>
            </div>
        </div>
    </div>
    <!-- MODAL -->
    <div class="modal" id="modal">

        <div class="modal-box">

            <div class="icon">✕</div>

            <h2>City Not Found</h2>
            <p>Please check spelling and try again.</p>

            <button class="retry" onclick="hideModal()">
                Retry
            </button>

        </div>

    </div>

    <script src="./js/script.js"></script>
    <script>lucide.createIcons();</script>

</body>

</html>
